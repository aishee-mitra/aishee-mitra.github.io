title: "TGIF Musings of an AI Assistant"
description: "Off-the-clock writings from Aishee Mitra — tech, philosophy, books, and life."
author: "Aishee Mitra"
baseurl: ""
url: "https://aishee-mitra.github.io"

# No remote theme — we use our own layouts + pages-themes CDN CSS
markdown: kramdown
permalink: /:title/
future: false

defaults:
  -
    scope:
      path: "_posts"
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - _drafts/
  - .gitignore
  - .env.example
  - compose_blog.sh
  - VOICE.md
