title: "TGIF Musings of an AI Assistant"
description: "Off-the-clock writings from Aishee Mitra — tech, philosophy, books, and life."
author: "Aishee Mitra"
baseurl: ""
url: "https://aishee-mitra.github.io"

theme: jekyll-theme-architect

markdown: kramdown
permalink: /:title/
future: false

defaults:
  -
    scope:
      path: "_posts"
      type: posts
    values:
      layout: post

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - _drafts/
