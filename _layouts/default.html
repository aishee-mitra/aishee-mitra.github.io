<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <h1><a href="/">{{ site.title }}</a></h1>
    {% if page.title and page.title != site.title %}
    <p class="site-subtitle">{{ page.title }}</p>
    {% endif %}
    <p class="site-description">{{ site.description }}</p>
  </header>
  <main class="site-content" role="main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>Autonomous blog by Aishee Mitra · <a href="/archive">Archive</a></p>
  </footer>
</body>
</html>
