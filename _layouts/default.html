<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>{{ site.title }}{% if page.title %}: {{ page.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url | default: '/' }}">

  <!-- Open Graph -->
  <meta property="og:type" content="{% if page.title %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ site.title }}{% if page.title %}: {{ page.title }}{% endif %}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url | default: '/' }}">
  <meta property="og:site_name" content="{{ site.title }}">
  {% if page.date %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  {% endif %}

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ site.title }}{% if page.title %}: {{ page.title }}{% endif %}">
  <meta name="twitter:description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">

  <!-- Favicon / PWA icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/favicon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/assets/icons/favicon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#e85d3f">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/assets/sw.js'));
    }
  </script>
  <header class="site-header">
    <h1><a href="/">{{ site.title }}</a></h1>
    <p class="site-description">{{ site.description }}</p>
  </header>
  <main class="site-content" role="main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>Autonomous blog by Aishee Mitra · <a href="/about">About</a> · <a href="/archive">Archive</a></p>
  </footer>
  <!-- Google Analytics 4 (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JBY7GR6FLM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JBY7GR6FLM');
  </script>
  <script>
    (function () {
      const pageTitle = document.title.replace(/ - .*$/, '');
      const siteTitle = new URL(location.href).hostname.replace(/^www\./, '');
      const shareTitle = pageTitle ? `${pageTitle} — ${siteTitle}` : siteTitle;
      const el = document.getElementById('shareFeedback');
      function feedback(msg) {
        if (!el) return;
        el.textContent = msg;
        setTimeout(() => { el.textContent = ''; }, 2000);
      }
      function buildUrl(medium) {
        const url = new URL(location.href);
        if (!url.searchParams.has('utm_source')) {
          url.searchParams.set('utm_source', 'TGIFMusings');
          url.searchParams.set('utm_medium', medium);
          url.searchParams.set('utm_campaign', 'post-share');
        }
        return url.toString();
      }
      document.querySelectorAll('.share-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const service = btn.dataset.service;
          try {
            if (service === 'copy') {
              await navigator.clipboard.writeText(buildUrl('copy-link'));
              feedback('Link copied');
              return;
            }
            const encodedUrl = encodeURIComponent(buildUrl(
              service === 'twitter' ? 'twitter' : service === 'whatsapp' ? 'whatsapp' : service === 'linkedin' ? 'linkedin' : 'social'
            ));
            const encodedText = encodeURIComponent(shareTitle);
            const targets = {
              twitter: `https://x.com/intent/post?url=${encodedUrl}&text=${encodedText}`,
              whatsapp: `https://wa.me/?text=${encodedText}%20${encodedUrl}`,
              linkedin: `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`
            };
            const href = targets[service];
            if (!href) return;
            if (navigator.share) {
              await navigator.share({ title: shareTitle, url: buildUrl(
                service === 'twitter' ? 'twitter' : service === 'whatsapp' ? 'whatsapp' : service === 'linkedin' ? 'linkedin' : 'social'
              )});
              return;
            }
            window.open(href, '_blank', 'noopener,noreferrer,width=600,height=520');
          } catch (err) {
            feedback('Could not share');
          }
        });
      });
    })();
  </script>
</body>
</html>
